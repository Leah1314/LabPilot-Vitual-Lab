name: Deploy pathogen-pathfinder to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pathogen-pathfinder/**"
      - ".github/workflows/gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. Queue rather than cancel, so a run that is
# already publishing finishes instead of leaving the site half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pathogen-pathfinder
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pathogen-pathfinder/package-lock.json

      - name: Install
        run: npm ci

      # `output: "export"` cannot build a route handler with POST/PATCH/DELETE,
      # and there is no server on Pages to run the agent on anyway. Deleted in
      # the disposable CI checkout only — the committed tree keeps the route so
      # `npm run dev` and the Docker image are unaffected.
      - name: Drop server-only routes
        run: rm -rf src/app/api

      - name: Build static export
        run: npm run build
        env:
          STATIC_EXPORT: "1"

      # Next emits assets under _next/, and a leading underscore is what Jekyll
      # excludes. Cheap insurance against the whole site loading unstyled.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v6
        with:
          # Turns Pages on for the repo if it is not already enabled, so this
          # does not require a manual settings change first. Needs the repo's
          # Pages source set to "GitHub Actions"; this sets it.
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          # Relative to the workspace root, not to `working-directory`.
          path: pathogen-pathfinder/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
